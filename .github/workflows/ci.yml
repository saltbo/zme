name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      COVERAGE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture boundaries
        run: pnpm lint:arch

      - name: Typecheck
        run: pnpm typecheck

      - name: OpenAPI contract lint
        run: pnpm openapi:lint

      - name: OpenAPI semantic signature
        run: pnpm openapi:diff

      - name: BDD and native evidence inventory
        run: pnpm quality:inventory

      - name: Validate migration history
        run: pnpm db:check

      - name: Migrations are generated from schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::schema.ts changed without a generated migration. Run 'pnpm db:generate' and commit."
            git status --short migrations
            exit 1
          fi

      - name: Test (unit + api)
        run: pnpm test:ci

      - name: Coverage report
        run: pnpm test:coverage

      - name: Changed architecture coverage threshold
        run: pnpm test:coverage:task

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    env:
      COVERAGE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: E2E (real stack)
        run: pnpm e2e:ci
