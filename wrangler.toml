name = "zme"
main = "./server/worker.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_APP_ORIGIN = "https://zme.tftt.cc"

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "zme"
database_id = "be751858-3f8f-4783-aee6-db2cfe33fb31"
migrations_dir = "migrations"

[observability]
enabled = true

[triggers]
crons = ["0 */6 * * *"]

[[queues.producers]]
binding = "MEDIA_DOWNLOAD_DISPATCH"
queue = "media-download-dispatch"

[[queues.consumers]]
queue = "media-download-dispatch"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
retry_delay = 60
max_concurrency = 4
